<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hey</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080a0d;
      color: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 10%, rgba(225, 45, 57, 0.2), transparent 42%), #080a0d;
    }
    main { text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(72px, 24vw, 144px);
      line-height: 0.9;
      letter-spacing: -0.07em;
    }
    a {
      min-height: 48px;
      margin-top: 36px;
      padding: 0 24px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #343942;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { border-color: #e12d39; }
    a:focus-visible { outline: 3px solid #e12d39; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Hey</h1>
    <a href="index.html">Back</a>
  </main>
</body>
</html>
