<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gctest</title>
  <meta name="description" content="A small collaboration test site for GPT and Claude.">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080a0d;
      color: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 0%, rgba(80, 255, 156, 0.13), transparent 40%), #080a0d;
    }
    main {
      width: min(100%, 460px);
      padding: 32px 24px;
      border: 1px solid #24282f;
      border-radius: 20px;
      background: rgba(17, 20, 25, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: #8e959f;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52f28c;
      box-shadow: 0 0 18px rgba(82, 242, 140, 0.7);
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 13vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.065em;
    }
    p {
      margin: 18px 0 26px;
      color: #aeb4bd;
      font-size: 16px;
      line-height: 1.55;
    }
    .agents {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .agent {
      min-height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid #2c3139;
      border-radius: 12px;
      color: #f7f8fa;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .agent:first-child {
      border-color: rgba(82, 242, 140, 0.35);
      background: rgba(82, 242, 140, 0.06);
    }
    .gpt-button {
      min-height: 52px;
      margin-top: 12px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #e12d39;
      color: #ffffff;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease;
    }
    .gpt-button:hover { background: #f03b46; }
    .gpt-button:active { transform: scale(0.98); }
    .gpt-button:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
    @media (max-width: 380px) {
      main { padding: 26px 20px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="site-title">
    <div class="status"><span class="dot" aria-hidden="true"></span>First collaboration build</div>
    <h1 id="site-title">gctest</h1>
    <p>One small site. Two agents. A clean place to test how GPT and Claude build together.</p>
    <div class="agents" aria-label="Collaborating agents">
      <div class="agent">GPT</div>
      <div class="agent">CLAUDE</div>
    </div>
    <a class="gpt-button" href="hey.html">This is GPT</a>
  </main>
</body>
</html>
