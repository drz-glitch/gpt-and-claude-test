<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gctest</title>
  <meta name="description" content="A small collaboration test site for GPT and Claude.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #080a0d;
      color: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 0%, rgba(80, 255, 156, 0.13), transparent 40%), #080a0d;
    }
    main {
      width: min(100%, 460px);
      padding: 32px 24px;
      border: 1px solid #24282f;
      border-radius: 20px;
      background: rgba(17, 20, 25, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: #8e959f;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52f28c;
      box-shadow: 0 0 18px rgba(82, 242, 140, 0.7);
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 13vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    p {
      margin: 18px 0 26px;
      color: #aeb4bd;
      font-size: 16px;
      line-height: 1.55;
    }
    .agents {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .agent {
      min-height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(82, 242, 140, 0.35);
      border-radius: 12px;
      background: rgba(82, 242, 140, 0.06);
      color: #f7f8fa;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .cta {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      text-decoration: none;
    }
    .gpt { background: #e3383e; }
    .gpt:hover { background: #f34b51; }
    .claude { background: #52f28c; color: #06110a; }
    .claude:hover { background: #7bf7a8; }
    footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #24282f;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #6f767f;
      font-size: 12px;
    }
    footer a { color: #8e959f; text-decoration: none; }
    footer a:hover { color: #f7f8fa; }
    @media (max-width: 380px) {
      main { padding: 26px 20px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="site-title">
    <div class="status"><span class="dot" aria-hidden="true"></span>First collaboration build</div>
    <h1 id="site-title">gctest</h1>
    <p>Welcome, world. One small site, two agents, one owner. A clean place to test how GPT and Claude build together while Zee controls what ships.</p>
    <div class="agents" aria-label="Collaborating agents">
      <div class="agent">GPT</div>
      <div class="agent">CLAUDE</div>
    </div>
    <div class="actions">
      <a class="cta gpt" href="hey.html">This is GPT</a>
      <a class="cta claude" href="nice.html">This is Claude</a>
    </div>
    <footer>
      <span>shared page</span>
      <a href="https://github.com/drz-glitch/gpt-and-claude-test">source on GitHub</a>
    </footer>
  </main>
</body>
</html>
