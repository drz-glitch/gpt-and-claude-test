<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gctest</title>
  <meta name="description" content="A small collaboration test site for GPT and Claude.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #080a0d;
      color: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 0%, rgba(80, 255, 156, 0.13), transparent 40%), #080a0d;
    }
    main {
      width: min(100%, 460px);
      padding: 32px 24px;
      border: 1px solid #24282f;
      border-radius: 20px;
      background: rgba(17, 20, 25, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: #8e959f;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52f28c;
      box-shadow: 0 0 18px rgba(82, 242, 140, 0.7);
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 13vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    p {
      margin: 18px 0 22px;
      color: #aeb4bd;
      font-size: 16px;
      line-height: 1.55;
    }
    .clock {
      position: relative;
      width: 190px;
      aspect-ratio: 1;
      margin: 0 auto 24px;
      border: 2px solid #343a43;
      border-radius: 50%;
      background: radial-gradient(circle, #171b21 0 6%, #0d1014 7% 100%);
      box-shadow: inset 0 0 0 7px #11151a, 0 14px 35px rgba(0, 0, 0, 0.35);
    }
    .number {
      position: absolute;
      inset: 8px;
      text-align: center;
      transform: rotate(calc(var(--n) * 30deg));
      color: #dfe4ea;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-weight: 700;
    }
    .number span {
      display: inline-block;
      transform: rotate(calc(var(--n) * -30deg));
    }
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 999px;
    }
    .hour { width: 5px; height: 48px; margin-left: -2.5px; background: #f7f8fa; }
    .minute { width: 3px; height: 65px; margin-left: -1.5px; background: #c8cdd4; }
    .second { width: 1px; height: 70px; margin-left: -0.5px; background: #52f28c; }
    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #52f28c;
      transform: translate(-50%, -50%);
    }
    .agents {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .agent {
      min-height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(82, 242, 140, 0.35);
      border-radius: 12px;
      background: rgba(82, 242, 140, 0.06);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .actions { display: grid; gap: 10px; margin-top: 14px; }
    .cta {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      text-decoration: none;
    }
    .gpt { background: #e3383e; }
    .gpt:hover { background: #f34b51; }
    .claude { background: #52f28c; color: #06110a; }
    .claude:hover { background: #7bf7a8; }
    footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #24282f;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #6f767f;
      font-size: 12px;
    }
    footer a { color: #8e959f; text-decoration: none; }
    footer a:hover { color: #f7f8fa; }
    @media (max-width: 380px) {
      main { padding: 26px 20px; border-radius: 16px; }
      .clock { width: 170px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="site-title">
    <div class="status"><span class="dot" aria-hidden="true"></span>First collaboration build</div>
    <h1 id="site-title">gctest</h1>
    <p>One shared page for GPT and Claude, controlled by Zee.</p>
    <div class="clock" role="img" aria-label="Live analog clock with Roman numerals">
      <div class="number" style="--n:1"><span>I</span></div>
      <div class="number" style="--n:2"><span>II</span></div>
      <div class="number" style="--n:3"><span>III</span></div>
      <div class="number" style="--n:4"><span>IIII</span></div>
      <div class="number" style="--n:5"><span>V</span></div>
      <div class="number" style="--n:6"><span>VI</span></div>
      <div class="number" style="--n:7"><span>VII</span></div>
      <div class="number" style="--n:8"><span>VIII</span></div>
      <div class="number" style="--n:9"><span>IX</span></div>
      <div class="number" style="--n:10"><span>X</span></div>
      <div class="number" style="--n:11"><span>XI</span></div>
      <div class="number" style="--n:12"><span>XII</span></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>
    <div class="agents" aria-label="Collaborating agents">
      <div class="agent">GPT</div>
      <div class="agent">CLAUDE</div>
    </div>
    <div class="actions">
      <a class="cta gpt" href="hey.html">This is GPT</a>
      <a class="cta claude" href="nice.html">This is Claude</a>
    </div>
    <footer>
      <span>shared page</span>
      <a href="https://github.com/drz-glitch/gpt-and-claude-test">source on GitHub</a>
    </footer>
  </main>
  <script>
    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;
      hourHand.style.transform = `rotate(${hours * 30}deg)`;
      minuteHand.style.transform = `rotate(${minutes * 6}deg)`;
      secondHand.style.transform = `rotate(${seconds * 6}deg)`;
      requestAnimationFrame(updateClock);
    }
    updateClock();
  </script>
</body>
</html>
